name: Build release installers
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without v (for example 0.1.0-rc.3)
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - name: Verify native macOS ARM64
        if: runner.os == 'macOS'
        run: |
          if ((go env GOARCH) -ne 'arm64') { throw 'Expected native macOS ARM64' }
      - name: Prepare Git
        run: ./scripts/prepare-ci-git.ps1
      - name: Prepare Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm cpio
          if ($LASTEXITCODE -ne 0) { throw 'Packaging tools preparation failed' }
      - name: Build native installer
        run: |
          go run ./scripts/release -mode native -version "$env:RELEASE_VERSION" -out .tools/release-native
          if ($LASTEXITCODE -ne 0) { throw 'Native installer build failed' }
      - name: Install and initialize a real project
        run: ./scripts/installer/smoke.ps1 -Version "$env:RELEASE_VERSION" -PackageDirectory .tools/release-native
      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ runner.os }}
          path: .tools/release-native/*
          if-no-files-found: error
  bundle:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          merge-multiple: true
          path: .tools/release-input
      - name: Assemble installers, portable archives and checksums
        run: |
          go run ./scripts/release -mode bundle -version "$env:RELEASE_VERSION" -installer-dir .tools/release-input -out .tools/release
          if ($LASTEXITCODE -ne 0) { throw 'Release bundle build failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: git-task-${{ inputs.version }}
          path: .tools/release/*
          if-no-files-found: error
